name: Creator mode real UI screenshots
on:
  push:
    branches: [qa/creator-real-ui]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_SNAPSHOT: replay
      DSH_CREATOR_EVIDENCE_DIR: ${{ github.workspace }}/creator-evidence
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Build real application artifacts
        run: pnpm run build:artifacts
      - name: Run real UI screenshot tests with keyless replay
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/creator-controls.e2e.ts
      - name: Upload actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-real-ui-screenshots
          path: creator-evidence
          if-no-files-found: warn
          retention-days: 7
